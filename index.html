<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MotorHub</title>
<style>
:root{--bg:#111418;--card:#1b2027;--card2:#242b34;--txt:#eef1f5;--mut:#8b96a5;--acc:#ff7a1a;--ok:#3ecf8e;--red:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid #232a33}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0;flex:1}
h1 b{color:var(--acc)}
h1 .v{font-size:11px;font-weight:400;color:var(--mut);margin-left:6px}
button{font:inherit;color:var(--txt);background:var(--card2);border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
button.p{background:var(--acc);color:#111;font-weight:700}
button.d{color:var(--red)}
button.s{padding:8px 12px;font-size:14px}
input,textarea,select{width:100%;font:inherit;color:var(--txt);background:var(--card);border:1px solid #2c3541;border-radius:12px;padding:12px;margin:4px 0 10px}
textarea{min-height:130px;resize:vertical}
label{font-size:13px;color:var(--mut)}
#q{margin:10px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);color:var(--mut);font-size:14px}
.chip.on{background:var(--acc);color:#111;font-weight:700}
main{padding:12px 14px}
.item{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.item .m{font-weight:700;font-size:17px}
.item .b{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;background:var(--card2);color:var(--mut);border-radius:8px;padding:2px 8px;margin:6px 6px 0 0}
.tag.pdf{color:var(--acc)}
.empty{text-align:center;color:var(--mut);margin-top:50px}
.proc{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.proc summary{padding:14px;font-weight:700;cursor:pointer;list-style:none}
.proc summary::-webkit-details-marker{display:none}
.proc summary:after{content:"▾";float:right;color:var(--mut)}
.proc[open] summary:after{content:"▴"}
.proc ol{margin:0;padding:0 14px 6px 38px}
.proc li{padding:6px 0;border-top:1px solid #232a33}
.proc .act{display:flex;gap:8px;padding:8px 14px 14px}
.row{display:flex;gap:8px}
.row>*{flex:1}
h2{font-size:18px;margin:16px 0 8px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 4px 14px #0008;border-radius:30px;padding:16px 22px}
.note{color:var(--mut);font-size:14px;white-space:pre-wrap}
.back{background:none;padding:8px 4px;color:var(--acc)}
.banner{background:#3a2a12;color:#ffb36b;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.banner.ok{background:#12301f;color:#7ee2b0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.card{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.card .v{font-size:22px;font-weight:700}
.card .l{font-size:12px;color:var(--mut)}
.card.ot .v{color:var(--acc)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.mnav b{text-transform:capitalize}
.wk{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:14px 2px 6px}
.wk b{color:var(--acc)}
.day{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:6px}
.day .dd{width:54px;font-weight:700}
.day .dd small{display:block;color:var(--mut);font-weight:400;font-size:12px;text-transform:capitalize}
.day .tt{flex:1;font-size:14px;color:var(--mut)}
.day .hh{font-weight:700;text-align:right}
.day .hh small{display:block;color:var(--acc);font-size:12px}
.it{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-top:1px solid #232a33}
.it .l{flex:1;color:var(--mut);font-size:14px}
.it b{text-align:right}
.it .rp{color:var(--mut);padding:0 4px;cursor:pointer}
.sec{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sec h3{margin:0;padding:12px;font-size:15px;color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.dh{text-align:center;font-size:11px;color:var(--mut);padding:2px 0}
.cl{background:var(--card);border-radius:10px;min-height:70px;padding:5px 1px;text-align:center;cursor:pointer}
.cl.bl{background:none;cursor:default}
.cl .n{font-size:13px;color:var(--mut);margin-bottom:2px}
.cl .t{font-size:11px;line-height:1.3}
.cl.ok{background:#1f2a22}
.cl.ok .n{color:var(--txt);font-weight:700}
.cl.fs .n{color:var(--red)}
.nt{white-space:pre-wrap;word-break:break-word;margin-top:6px;font-size:15px}
.cl.pt{background:#2d2616;border:1px dashed var(--acc)}
.cl.pt .n{color:var(--txt);font-weight:700}
.cl.td{outline:2px solid var(--acc)}
.tm .x{width:44px;font-size:16px;color:var(--mut)}
#sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
#sheet .bk{position:absolute;inset:0;background:#000a}
#sheet .pn{position:relative;background:var(--card);border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
#sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:18px}
.tm{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.tm button{width:52px;padding:12px 0;font-size:22px;flex:none}
.tm input{text-align:center;font-size:22px;margin:0;flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid #2c3541}
.kv span{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ok);color:#111;padding:10px 16px;border-radius:12px;font-weight:700;display:none;z-index:9}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<div id="toast"></div>

<script>
// ---------- Archivio (IndexedDB) ----------
const DB='motorhub',ST='kv';
const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const dbGet=async k=>{const d=await idb();return new Promise(ok=>{const q=d.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>ok(q.result)})};
const dbSet=async(k,v)=>{const d=await idb();return new Promise(ok=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).put(v,k);t.oncomplete=ok})};
const dbDel=async k=>{const d=await idb();return new Promise(ok=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).delete(k);t.oncomplete=ok})};

let motors=[];            // {id,brand,model,type,notes,hasPdf,procs:[{id,title,steps:[]}]}
let view={name:'list'};   // list | motor | editMotor | editProc | menu
let q='',brandF='';
let cfg={token:'',expiry:'',status:null,lastSync:''};  // chiave, scadenza chiave, esito controllo automatico
let usage=[];                                         // registro d'uso (ultimi 300 eventi)
const REPO='andreaguiotto02-8/motorhub-data',APPV='2.1';

const save=async()=>{await dbSet('motors',motors);schedulePush()};
const saveCfg=()=>dbSet('cfg',cfg);

// ---------- Orari di lavoro ----------
let hoursData={weeklyHours:40,dailyHours:8,localHolidays:['11-11'],days:{}};   // days: {'2026-11-11':{in:'07:30',out:'16:30',lunch:60}}
let notes=[];   // appunti di lavoro: {id,title,text,t}
let payslips=[],slipData={},reports=[];   // buste: {id,ym,name}; dati letti dalla pianificata; segnalazioni di errore
const saveNotes=async()=>{await dbSet('notes',notes);schedulePush()};
const saveSlips=async()=>{await dbSet('payslips',payslips);schedulePush()};
const saveReports=async()=>{await dbSet('reports',reports);schedulePush()};
const saveHours=async()=>{await dbSet('hours',hoursData);schedulePush()};
const tabs=a=>`<div class="chips" style="margin-top:6px"><div class="chip ${a==='list'?'on':''}" onclick="go('list')">Motori</div><div class="chip ${a==='hours'?'on':''}" onclick="go('hours')">Orari</div><div class="chip ${a==='slips'?'on':''}" onclick="go('slips')">Buste</div><div class="chip ${a==='notes'?'on':''}" onclick="go('notes')">Note</div></div>`;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const toMin=t=>{if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+m};
const dayMin=d=>d&&d.in&&d.out?Math.max(0,toMin(d.out)-toMin(d.in)-(+d.lunch||0)):0;
const fmt=m=>{const s=m<0?'-':'';m=Math.abs(Math.round(m));return s+Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};
const monday=ds=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)};
// Regola: lun-ven prime N ore (default 8) ordinarie, il resto straordinario; sabato tutto straordinario;
// domeniche e festività (nazionali + locali) conteggiate a parte come "festive"
function easterMon(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;const x=new Date(y,mo-1,da+1,12);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
const _hc={};
function holidays(y){
  if(_hc[y+JSON.stringify(hoursData.localHolidays)])return _hc[y+JSON.stringify(hoursData.localHolidays)];
  const set=new Set(['01-01','01-06','04-25','05-01','06-02','08-15','11-01','12-08','12-25','12-26',...(hoursData.localHolidays||[])].map(x=>y+'-'+x));
  set.add(easterMon(y));return _hc[y+JSON.stringify(hoursData.localHolidays)]=set;
}
function isFest(ds){const d=new Date(ds+'T12:00:00');return d.getDay()===0||holidays(d.getFullYear()).has(ds)}
function dayCalc(ds){
  const w=dayMin(hoursData.days[ds]),lim=((+hoursData.weeklyHours||40)/5)*60;
  if(isFest(ds))return{ord:0,ot:0,fest:w,tot:w};
  if(new Date(ds+'T12:00:00').getDay()===6)return{ord:0,ot:w,fest:0,tot:w};
  return{ord:Math.min(w,lim),ot:Math.max(0,w-lim),fest:0,tot:w};
}
function calcOT(){const ot={};Object.keys(hoursData.days).forEach(ds=>ot[ds]=dayCalc(ds).ot);return ot}

// ---------- Registro d'uso ----------
function log(type,info){
  const last=usage[usage.length-1];
  if(last&&last.type===type&&last.info===info)return;
  usage.push({t:new Date().toISOString(),type,info:info||''});
  if(usage.length>300)usage=usage.slice(-300);
  dbSet('usage',usage);
}
addEventListener('error',e=>log('error',String(e.message||e).slice(0,200)));
addEventListener('unhandledrejection',e=>log('error',String(e.reason).slice(0,200)));

// ---------- Collegamento con GitHub (deposito privato) ----------
const gh=(path,opt={})=>fetch(`https://api.github.com/repos/${REPO}/contents/${path}`,{...opt,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json',...(opt.headers||{})}});
async function ghPut(path,b64,msg){
  let r;
  for(let i=0;i<3;i++){
    let sha;const g=await gh(path+'?t='+Date.now());if(g.ok)sha=(await g.json()).sha;
    r=await gh(path,{method:'PUT',body:JSON.stringify({message:msg,content:b64,sha})});
    if(r.ok)return;
    if(r.status!==409&&r.status!==422)break;
    await new Promise(k=>setTimeout(k,700*(i+1)));
  }
  throw new Error('GitHub '+r.status);
}
const toB64=s=>{const b=new TextEncoder().encode(s);let x='';b.forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const fileB64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=ko;r.readAsDataURL(f)});
const ghRaw=async p=>{const r=await gh(p,{headers:{Accept:'application/vnd.github.raw'}});return r.ok?r.text():null};

let pushT;
function schedulePush(){if(!cfg.token)return;clearTimeout(pushT);pushT=setTimeout(pushState,4000)}
async function pushState(){
  try{
    await ghPut('state.json',toB64(JSON.stringify({app:'motorhub',appVersion:APPV,updated:new Date().toISOString(),motors},null,1)),'Dati app');
    await ghPut('hours.json',toB64(JSON.stringify({appVersion:APPV,updated:new Date().toISOString(),...hoursData,days:Object.fromEntries(Object.entries(hoursData.days).filter(([k,v])=>v.in&&v.out)),dailyHours:(+hoursData.weeklyHours||40)/5},null,1)),'Orari');
    await ghPut('notes.json',toB64(JSON.stringify({appVersion:APPV,notes},null,1)),'Appunti');
    await ghPut('payslips.json',toB64(JSON.stringify({appVersion:APPV,payslips},null,1)),'Elenco buste');
    await ghPut('reports.json',toB64(JSON.stringify({appVersion:APPV,reports},null,1)),'Segnalazioni');
    await ghPut('usage.json',toB64(JSON.stringify({appVersion:APPV,events:usage},null,1)),'Registro uso');
    cfg.lastSync=new Date().toISOString();saveCfg();return true;
  }catch(e){log('error','sync: '+e.message);return false}
}
async function pullUpdates(){
  if(!cfg.token)return false;
  try{
    const st=await ghRaw('status.json');if(st){try{cfg.status=JSON.parse(st);saveCfg()}catch{}}
    const rs=await ghRaw('reports_status.json');
    if(rs){try{const m=JSON.parse(rs);let ch=false;reports.forEach(r=>{const x=m[r.id];if(x&&(x.status!==r.status||x.reply!==r.reply)){r.status=x.status;r.reply=x.reply||'';ch=true}});if(ch)await dbSet('reports',reports)}catch{}}
    const sl=await gh('extracted_buste');
    if(sl.ok){for(const f of await sl.json()){if(!f.name.endsWith('.json'))continue;const id=f.name.slice(0,-5);if(!payslips.find(x=>x.id===id))continue;try{slipData[id]=JSON.parse(await ghRaw(f.path))}catch{}}await dbSet('slipData',slipData)}
    if(['slips','slip','menu'].includes(view.name))render();
    const r=await gh('extracted');if(!r.ok)return r.status===404;
    let changed=false;
    for(const f of await r.json()){
      if(!f.name.endsWith('.json'))continue;
      const m=motors.find(x=>x.id===f.name.slice(0,-5));if(!m)continue;
      let d;try{d=JSON.parse(await ghRaw(f.path))}catch{continue}
      if(!Array.isArray(d.procs))continue;
      const ids=new Set(d.procs.map(p=>p.id));
      for(const p of d.procs){
        const ex=m.procs.find(x=>x.id===p.id);
        if(!ex){m.procs.push({id:p.id,title:p.title,steps:p.steps,source:'pdf'});changed=true}
        else if(ex.source==='pdf'&&JSON.stringify([ex.title,ex.steps])!==JSON.stringify([p.title,p.steps])){ex.title=p.title;ex.steps=p.steps;changed=true}
      }
      const before=m.procs.length;m.procs=m.procs.filter(x=>x.source!=='pdf'||ids.has(x.id));if(m.procs.length!==before)changed=true;
    }
    if(changed){await dbSet('motors',motors);toast('Nuove procedure dai PDF');render()}
    return true;
  }catch(e){log('error','aggiornamento: '+e.message);return false}
}
async function uploadPdf(id,f){
  if(!cfg.token)return;
  try{await ghPut('pdf/'+id+'.pdf',await fileB64(f),'PDF '+id);toast('PDF inviato per la lettura automatica')}
  catch(e){log('error','pdf: '+e.message);toast('PDF non inviato (controlla la chiave)')}
}
function daysLeft(){if(!cfg.expiry)return null;return Math.ceil((new Date(cfg.expiry+'T23:59:59')-new Date())/864e5)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
const $=id=>document.getElementById(id);

// ---------- Schermate ----------
function render(){
  const hd=$('hd'),app=$('app');
  if(view.name==='list') return renderList(hd,app);
  if(view.name==='motor') return renderMotor(hd,app);
  if(view.name==='editMotor') return renderEditMotor(hd,app);
  if(view.name==='editProc') return renderEditProc(hd,app);
  if(view.name==='menu') return renderMenu(hd,app);
  if(view.name==='hours') return renderHours(hd,app);
  if(view.name==='slips') return renderSlips(hd,app);
  if(view.name==='notes') return renderNotes(hd,app);
  if(view.name==='editNote') return renderEditNote(hd,app);
  if(view.name==='slip') return renderSlip(hd,app);
  if(view.name==='addSlip') return renderAddSlip(hd,app);
  if(view.name==='report') return renderReport(hd,app);
}

function renderList(hd,app){
  const brands=[...new Set(motors.map(m=>m.brand).filter(Boolean))].sort();
  hd.innerHTML=`<div class="top"><h1>Motor<b>Hub</b><small class="v">v${APPV}</small></h1><button class="s" onclick="go('menu')">⋯</button></div>${tabs('list')}
  <input id="q" type="search" placeholder="Cerca motore, marca o procedura…" value="${esc(q)}">
  <div class="chips"><div class="chip ${brandF?'':'on'}" onclick="setBrand('')">Tutti</div>${brands.map(b=>`<div class="chip ${brandF===b?'on':''}" onclick="setBrand('${esc(b)}')">${esc(b)}</div>`).join('')}</div>`;
  $('q').oninput=e=>{q=e.target.value;list()};
  const dl=daysLeft();
  const warn=cfg.token&&dl!==null&&dl<=30?`<div class="banner" onclick="go('menu')">${dl<0?'La chiave di collegamento è scaduta.':'La chiave di collegamento scade tra '+dl+' giorni.'} Tocca qui per rinnovarla. Ricorda anche la chiave di Koalendario (archivio koalendario-data), che scade lo stesso giorno.</div>`:'';
  app.innerHTML=warn+'<div id="lst"></div><button class="p fab" onclick="newMotor()">+ Motore</button>';
  list();
}
function list(){
  const t=q.toLowerCase().trim();
  const r=motors.filter(m=>(!brandF||m.brand===brandF)&&(!t||[m.brand,m.model,m.type,m.notes,...m.procs.map(p=>p.title+' '+p.steps.join(' '))].join(' ').toLowerCase().includes(t)))
    .sort((a,b)=>(a.brand+a.model).localeCompare(b.brand+b.model));
  $('lst').innerHTML=r.length?r.map(m=>`<div class="item" onclick="openMotor('${m.id}')"><div class="m">${esc(m.model)}</div><div class="b">${esc(m.brand)}${m.type?' · '+esc(m.type):''}</div>
   <span class="tag">${m.procs.length} procedure</span>${m.hasPdf?'<span class="tag pdf">PDF</span>':''}</div>`).join('')
   :`<div class="empty">${motors.length?'Nessun risultato':'Nessun motore.<br>Premi “+ Motore” per iniziare.'}</div>`;
  if(!r.length&&t.length>=3)log('ricerca_senza_risultati',t);
}
function setBrand(b){brandF=b;render()}
function go(n,extra={}){view={name:n,...extra};render();scrollTo(0,0)}
function openMotor(id){go('motor',{id})}

function renderMotor(hd,app){
  const m=motors.find(x=>x.id===view.id);if(!m)return go('list');
  hd.innerHTML=`<div class="top"><button class="back" onclick="go('list')">‹ Indietro</button><h1 style="text-align:right">${esc(m.model)}</h1></div>`;
  app.innerHTML=`<div class="b" style="color:var(--mut)">${esc(m.brand)}${m.type?' · '+esc(m.type):''}</div>
  ${m.notes?`<p class="note">${esc(m.notes)}</p>`:''}
  <div class="row" style="margin:10px 0">
    ${m.hasPdf?'<button class="p" onclick="openPdf()">📄 Apri PDF</button>':''}
    <button onclick="pickPdf()">${m.hasPdf?'Cambia PDF':'📎 Allega PDF'}</button>
    <button onclick="go('editMotor',{id:'${m.id}'})">Modifica</button>
  </div>
  <input type="file" id="pdfIn" accept="application/pdf" hidden>
  <h2>Procedure</h2>
  ${m.procs.map(p=>`<details class="proc"><summary>${esc(p.title)}${p.source==='pdf'?' <span class="tag pdf">dal PDF</span>':''}</summary><ol>${p.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    <div class="act"><button class="s" onclick="go('editProc',{id:'${m.id}',pid:'${p.id}'})">Modifica</button><button class="s d" onclick="delProc('${p.id}')">Elimina</button><button class="s" onclick="reportProc('${p.id}')">⚠ Segnala errore</button></div></details>`).join('')||'<div class="empty" style="margin:20px 0">Nessuna procedura ancora.</div>'}

// pannello del giorno: tocchi un giorno del calendario. Si può segnare anche solo l'entrata o solo l'uscita
let sheet=null;
function openDay(ds){const x=hoursData.days[ds];sheet={ds,mode:x?'view':'edit',sug:!x};drawSheet()}
function closeSheet(){sheet=null;const e=$('sheet');if(e)e.remove()}
function editSheet(sug){sheet.mode='edit';sheet.sug=!!sug;drawSheet()}
function drawSheet(){
  let e=$('sheet');if(!e){e=document.createElement('div');e.id='sheet';document.body.appendChild(e)}
  const ds=sheet.ds,x=hoursData.days[ds];
  const title=new Date(ds+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  let body;
  if(sheet.mode==='view'){
    const c=dayCalc(ds),done=x.in&&x.out;
    body=`<div class="kv"><span>Entrata</span><b>${x.in||'—'}</b></div><div class="kv"><span>Uscita</span><b>${x.out||'non ancora segnata'}</b></div><div class="kv"><span>Pausa pranzo</span><b>${x.lunch||0} min</b></div>
    ${done?`<div class="kv"><span>Ore lavorate</span><b>${fmt(c.tot)}</b></div>
    ${isFest(ds)?`<div class="kv"><span>Giorno festivo</span><b>${fmt(c.fest)}</b></div>`:`<div class="kv"><span>Ordinarie</span><b>${fmt(c.ord)}</b></div><div class="kv"><span>Straordinario</span><b style="color:var(--acc)">${fmt(c.ot)}</b></div>`}`:'<div class="kv"><span>Ore lavorate</span><b>da calcolare</b></div>'}
    ${x.in&&!x.out?'<button class="p" style="width:100%;margin-top:14px" onclick="editSheet(true)">Segna uscita</button>':''}
    <div class="row" style="margin-top:${x.in&&!x.out?'8':'14'}px"><button ${done||!x.in?'class="p"':''} onclick="editSheet(false)">Modifica</button><button class="d" onclick="delDay()">Elimina</button></div>`;
  }else{
    const type=k=>isFest(k)?'f':(new Date(k+'T12:00:00').getDay()===6?'s':'w'),keys=Object.keys(hoursData.days).filter(k=>hoursData.days[k].in&&hoursData.days[k].out).sort(),same=keys.filter(k=>type(k)===type(ds)&&k!==ds);
    const last=same.filter(k=>k<ds).pop()||same.pop()||keys.pop(),L=last?hoursData.days[last]:{in:'08:00',out:'17:00',lunch:60};
    const vin=x?(x.in||(sheet.sug?L.in:'')):L.in, vout=x?(x.out||(sheet.sug?L.out:'')):L.out, vl=x?x.lunch:L.lunch;
    const fld=(id,lab,v)=>`<label>${lab}</label><div class="tm"><button onclick="step('${id}',-15)">−</button><input id="${id}" type="time" value="${v||''}"><button onclick="step('${id}',15)">+</button><button class="x" title="Svuota" onclick="$('${id}').value=''">✕</button></div>`;
    body=fld('e_in','Entrata',vin)+fld('e_out','Uscita',vout)+
    `<label>Pausa pranzo (minuti)</label><div class="tm"><button onclick="step('e_lunch',-15)">−</button><input id="e_lunch" type="number" min="0" value="${vl??60}"><button onclick="step('e_lunch',15)">+</button></div>
    ${x?'':'<p class="note" style="margin:0 0 10px">Partono gli orari di un giorno simile già segnato. Puoi segnare anche solo l\'entrata e l\'uscita dopo.</p>'}
    <button class="p" style="width:100%" onclick="saveDay()">Salva</button>
    ${(!x||!x.in)?'<button style="width:100%;margin-top:8px" onclick="saveDay(\'in\')">Salva solo entrata</button>':''}`;
  }
  e.innerHTML=`<div class="bk" onclick="closeSheet()"></div><div class="pn"><div class="hd"><b style="text-transform:capitalize">${title}</b><button class="s" onclick="closeSheet()">✕</button></div>${body}</div>`;
}
function step(id,d){
  const el=$(id);
  if(id==='e_lunch'){el.value=Math.max(0,(+el.value||0)+d);return}
  let m=((toMin(el.value||(id==='e_out'?'17:00':'08:00'))+d)%1440+1440)%1440;
  el.value=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
}
async function saveDay(only){
  const i=$('e_in').value,o=only==='in'?'':$('e_out').value,l=parseInt($('e_lunch').value||'0',10);
  if(!i&&!o)return toast("Segna almeno l'entrata o l'uscita");
  if(i&&o){
    if(toMin(o)<=toMin(i))return toast("L'uscita deve essere dopo l'entrata");
    if(toMin(o)-toMin(i)<=l)return toast('La pausa è più lunga del turno');
  }
  hoursData.days[sheet.ds]={in:i,out:o,lunch:l};await saveHours();closeSheet();toast('Salvato');render();
}
async function delDay(){
  if(!confirm('Eliminare questo giorno?'))return;
  delete hoursData.days[sheet.ds];await saveHours();closeSheet();render();
}

// confronto tra ore in busta e ore calcolate dall'app con gli orari segnati
function slipCompare(p,d){
  const c=d.compare;if(!c)return '';
  const days=Object.keys(hoursData.days).filter(x=>x.startsWith(p.ym));
  if(!days.length)return `<div class="banner">Confronto ore: non hai segnato orari per questo mese.</div>`;
  const sum=k=>days.reduce((a,x)=>a+dayCalc(x)[k],0),appTot=sum('tot'),appOt=sum('ot'),appFest=sum('fest');
  const [Y,M]=p.ym.split('-').map(Number);let miss=0;
  for(let i=1;i<=new Date(Y,M,0).getDate();i++){const k=p.ym+'-'+String(i).padStart(2,'0'),g=new Date(Y,M-1,i).getDay();if(g>0&&g<6&&!isFest(k)&&!hoursData.days[k])miss++}
  const hm=h=>Math.round(h*60);
  const row=(label,app,h)=>{
    if(h==null)return `<div class="it"><span class="l">${label}<br><small>App ${fmt(app)} · Busta non indicato</small></span><b>—</b></div>`;
    const diff=app-hm(h),ok=Math.abs(diff)<=15;
    return `<div class="it"><span class="l">${label}<br><small>App ${fmt(app)} · Busta ${fmt(hm(h))}</small></span><b style="color:${ok?'var(--ok)':'var(--acc)'}">${ok?'✓ Torna':'Δ '+(diff>0?'+':'')+fmt(diff)}</b></div>`;
  };
  const any=c.ordinarie!=null||c.straordinarie!=null||c.festive!=null;
  const busta=any?(c.ordinarie||0)+(c.straordinarie||0)+(c.festive||0):null;
  return `<div class="sec"><h3>Confronto con i tuoi orari</h3>${row('Ore lavorate (totali)',appTot,busta)}${row('Straordinari (feriali e sabato)',appOt,c.straordinarie==null?null:c.straordinarie)}${(appFest>0||c.festive>0)?row('Ore lavorate in festivi/domeniche',appFest,c.festive==null?null:c.festive):''}
  <div class="it"><span class="l"><small>${c.altre_pagate>0?'In busta ci sono anche '+fmt(hm(c.altre_pagate))+' di ore pagate non lavorate (ferie, permessi, festività): non confrontate. ':''}Giorni feriali senza orario segnato nell'app: ${miss}.${c.note?' '+esc(c.note):''}</small></span><span class="rp" title="Segnala errore" onclick="reportCtx('Busta ${p.id} (${p.ym}) / Confronto ore')">⚠</span></div></div>`;
}

}

// ---------- Segnalazioni di errore ----------
function reportSlip(id,si,ii){const p=payslips.find(x=>x.id===id),it=slipData[id].sections[si].items[ii];reportCtx(`Busta ${id} (${p.ym}) / ${slipData[id].sections[si].title} / ${it.label} = ${it.value}`)}
function reportProc(pid){const m=motors.find(x=>x.id===view.id),p=m.procs.find(x=>x.id===pid);reportCtx(`Motore ${m.id} (${m.brand} ${m.model}) / procedura ${p.id} "${p.title}"`)}
function reportCtx(ctx){go('report',{ctx,back:view})}
function renderReport(hd,app){
  hd.innerHTML=`<div class="top"><button class="back" onclick="view=view.back;render()">‹ Annulla</button><h1 style="text-align:right">Segnala errore</h1></div>`;
  app.innerHTML=`<p class="note">${esc(view.ctx)}</p><label>Cosa non va? Scrivi cosa dovrebbe essere</label><textarea id="r_note" placeholder="es. Le ferie residue sono 12,5 giorni, non 8"></textarea><button class="p" style="width:100%" onclick="saveReport()">Invia segnalazione</button>`;
}
async function saveReport(){
  const note=$('r_note').value.trim();if(!note)return toast('Scrivi cosa non va');
  reports.push({id:uid(),t:new Date().toISOString(),ctx:view.ctx,note,status:'aperta',reply:''});
  await saveReports();toast('Segnalazione inviata');view=view.back;render();
}

function renderMenu(hd,app){
  hd.innerHTML=`<div class="top"><button class="back" onclick="go('list')">‹ Indietro</button><h1 style="text-align:right">Menu</h1></div>`;
  const dl=daysLeft(),stt=cfg.status;
  app.innerHTML=`<h2>Collegamento automatico</h2>
  <p class="note">Invia i PDF e i dati al deposito privato, da cui il controllo automatico ricava le procedure e migliora l'app.</p>
  <label>Chiave di accesso</label><input id="c_tok" type="password" autocomplete="off" placeholder="${cfg.token?'Chiave salvata (scrivi per sostituirla)':'Incolla qui la chiave'}">
  <label>Scadenza della chiave</label><input id="c_exp" type="date" value="${esc(cfg.expiry)}">
  <button class="p" style="width:100%" onclick="saveSync()">Salva collegamento</button>
  ${cfg.token?`<button style="width:100%;margin-top:10px" onclick="syncNow()">Sincronizza ora</button>`:''}
  ${cfg.token&&dl!==null?`<div class="banner ${dl>30?'ok':''}">${dl<0?'Chiave scaduta.':'Chiave valida ancora per '+dl+' giorni.'}</div>`:''}
  ${cfg.lastSync?`<p class="note">Ultimo invio dati: ${new Date(cfg.lastSync).toLocaleString('it-IT')}</p>`:''}
  ${stt?`<div class="banner ${stt.problems&&stt.problems.length?'':'ok'}"><b>Ultimo controllo automatico${stt.lastRun?' ('+new Date(stt.lastRun).toLocaleDateString('it-IT')+')':''}</b><br>${esc(stt.summary||'')}${(stt.problems||[]).map(x=>'<br>⚠ '+esc(x)).join('')}</div>`:''}
  <h2>Segnalazioni</h2>
  ${[...reports].sort((a,b)=>b.t.localeCompare(a.t)).slice(0,8).map(r=>`<div class="banner ${r.status==='risolta'?'ok':''}"><b>${r.status==='risolta'?'Risolta':r.status==='aperta'?'In attesa':esc(r.status)}</b> · ${esc(r.note)}${r.reply?'<br>'+esc(r.reply):''}</div>`).join('')||'<p class="note">Nessuna segnalazione.</p>'}
  <button style="width:100%" onclick="reportCtx('Generale (app)')">⚠ Segnala un problema dell'app</button>
  <h2>Copia di sicurezza</h2>
  <p class="note">Salva motori, procedure, orari e note in un file. I PDF non sono inclusi.</p>
  <button class="p" style="width:100%" onclick="exportData()">Esporta dati</button>
  <button style="width:100%;margin-top:10px" onclick="$('imp').click()">Importa dati</button>
  <input type="file" id="imp" accept="application/json" hidden>
  <p class="note" style="margin-top:24px">MotorHub v${APPV} · si aggiorna da solo a ogni avvio</p>`;
  $('imp').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());if(!Array.isArray(d.motors))throw 0;
      if(!confirm('Sostituire i dati attuali con quelli del file?'))return;
      motors=d.motors;if(d.hours&&d.hours.days)hoursData=d.hours;if(Array.isArray(d.notes)){notes=d.notes;await dbSet('notes',notes)}await dbSet('hours',hoursData);await save();toast('Dati importati');go('list')}catch{toast('File non valido')}
  };
}
async function saveSync(){
  const t=$('c_tok').value.trim();if(t)cfg.token=t;
  cfg.expiry=$('c_exp').value;await saveCfg();toast('Collegamento salvato');
  if(cfg.token){const ok=await pushState();toast(ok?'Collegamento funzionante':'Chiave non valida o senza permessi');}
  render();
}
async function syncNow(){
  toast('Sincronizzo…');const a=await pushState(),b=await pullUpdates();
  toast(a&&b?'Sincronizzato':'Problema di collegamento');render();
}
function exportData(){
  const b=new Blob([JSON.stringify({app:'motorhub',date:new Date().toISOString(),motors,hours:hoursData,notes},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='motorhub-dati.json';a.click();
}

// ---------- Avvio e aggiornamento automatico ----------
(async()=>{
  motors=(await dbGet('motors'))||[];
  cfg={...cfg,...((await dbGet('cfg'))||{})};
  usage=(await dbGet('usage'))||[];
  notes=(await dbGet('notes'))||[];
  payslips=(await dbGet('payslips'))||[];slipData=(await dbGet('slipData'))||{};reports=(await dbGet('reports'))||[];
  hoursData={...hoursData,...((await dbGet('hours'))||{})};
  log('apertura');
  render();
  if(cfg.token){pullUpdates().then(()=>schedulePush())}
  if('serviceWorker' in navigator){
    let had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload();had=true});
    navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
  }
})();
</script>
</body>
</html>
